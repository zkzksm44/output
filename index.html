<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#17253e"><title>톰슨팩토리 모바일 출고</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="overrides.css"></head>
<body>
  <div class="app-shell">
    <header class="topbar"><div><span class="brand-mark">T</span><strong>톰슨팩토리</strong></div><div class="top-actions"><span class="sync-status" id="syncStatus">로그인 필요</span><button class="history-btn" id="accountBtn">로그인</button></div></header>
    <main>
      <section class="page-title"><div><p id="todayText">오늘 출고</p><h1>출고품목 입력</h1></div><button class="more" aria-label="더보기">•••</button></section>
      <section class="total-card"><div><span>오늘 총 출고수량</span><strong id="grandTotal">0</strong><small>개</small></div><div class="progress"><i id="progressBar"></i></div><p><b id="filledCategories">0</b>/5개 출고 구분 입력</p></section>

      <nav class="category-tabs" aria-label="출고 구분">
        <button class="active" data-category="업소용"><span>업</span><em>쇼핑몰<br>업소용</em><b>0</b></button>
        <button data-category="S"><span>S</span><em>쇼핑몰 S</em><b>0</b></button>
        <button data-category="톰슨몰+거래처"><span>톰</span><em>톰슨몰<br>+거래처</em><b>0</b></button>
        <button data-category="픽업"><span>픽</span><em>픽업</em><b>0</b></button>
        <button data-category="냉장"><span>냉</span><em>냉장</em><b>0</b></button>
      </nav>

      <section class="entry-card">
        <div class="section-head"><div><h2 id="categoryTitle">쇼핑몰 업소용</h2><p>출고할 품목과 수량을 입력하세요.</p></div><span id="categorySubtotal">0개</span></div>
        <form id="entryForm">
          <label class="product-field">품명<input id="productInput" list="products" placeholder="예: 등심 100" autocomplete="off" required><datalist id="products"><option>등심 100</option><option>등심 120</option><option>등심 150</option><option>등심 180</option><option>등심 200</option><option>등심 250</option><option>안심</option><option>치즈</option><option>고치</option><option>고롤</option><option>생선</option><option>양념 생선</option><option>소스 5kg</option><option>롤치</option></datalist><small>같은 품명은 수량이 자동으로 합산됩니다.</small></label>
          <label>수량<div class="stepper"><button type="button" id="minusBtn">−</button><input id="qtyInput" type="number" min="1" value="1" inputmode="numeric" required><button type="button" id="plusBtn">＋</button></div></label>
          <button class="add-btn" type="submit">＋ 목록에 추가</button>
        </form>
      </section>

      <section class="list-section"><div class="list-head"><h2>입력 품목 <b id="itemCount">0</b></h2><button id="clearBtn">전체 삭제</button></div><div id="emptyState" class="empty"><span>＋</span><strong>아직 입력한 품목이 없습니다</strong><p>위 입력창에서 첫 품목을 추가해보세요.</p></div><div id="itemList" class="item-list"></div></section>
    </main>
    <footer class="bottom-action"><div><span>전체 합계</span><strong><b id="footerTotal">0</b>개</strong></div><button id="saveBtn">출고일지 저장</button></footer>
    <div class="toast" id="toast">출고일지가 저장되었습니다.</div>
    <div class="auth-modal" id="authModal" aria-hidden="true">
      <div class="auth-card">
        <button class="auth-close" id="authClose" aria-label="닫기">×</button>
        <span class="auth-icon">☁</span><h2>클라우드 동기화</h2>
        <p>같은 계정으로 로그인하면 모든 기기에서 출고 데이터를 확인할 수 있습니다.</p>
        <label>이메일<input id="authEmail" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com"></label>
        <label>비밀번호<input id="authPassword" type="password" autocomplete="current-password" minlength="6" placeholder="6자 이상"></label>
        <button class="auth-primary" id="signInBtn">로그인</button>
        <button class="auth-secondary" id="signUpBtn">처음 사용하기 · 계정 만들기</button>
        <button class="auth-signout" id="signOutBtn">로그아웃</button>
        <p class="auth-message" id="authMessage"></p>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body></html>
